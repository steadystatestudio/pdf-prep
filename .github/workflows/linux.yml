name: Build and verify Linux packages

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

jobs:
  build:
    name: Build Ubuntu 22.04 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install desktop runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth fonts-dejavu-core \
            libegl1 libopengl0 libgl1 libdbus-1-3 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 poppler-utils
      - name: Install pinned application and build dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip install pytest
          python -m pip check
      - name: Check the release source
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --basetemp="${{ runner.temp }}/pdf-${{ github.run_id }}-${{ github.run_attempt }}" --junitxml=artifacts/source-tests.xml
      - name: Fetch verified AppImage build tools
        run: python scripts/fetch_appimagetool.py
      - name: Build the portable archive and AppImage
        run: python scripts/build.py
      - name: Exercise exact packaged bytes on Ubuntu 22.04
        run: |
          mkdir -p artifacts/extracted
          (cd dist && sha256sum -c SHA256SUMS.txt)
          tar -xzf dist/PDF-Prep-linux-x86_64.tar.gz -C artifacts/extracted
          QT_QPA_PLATFORM=xcb xvfb-run -a artifacts/extracted/PDF-Prep/PDF-Prep --self-test "$PWD/artifacts/ubuntu22-portable.json"
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=xcb xvfb-run -a dist/PDF-Prep-x86_64.AppImage --self-test "$PWD/artifacts/ubuntu22-appimage.json"
      - name: Retain exact packages and validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: pdf-prep-linux
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
          path: |
            dist/PDF-Prep-linux-x86_64.tar.gz
            dist/PDF-Prep-x86_64.AppImage
            dist/SHA256SUMS.txt
            dist/PDF-Prep/BUILD-INFO.json
            dist/PDF-Prep/LINUX-SYSTEM-DEPENDENCIES.json
            artifacts/source-tests.xml
            artifacts/ubuntu22-*.json
            artifacts/*-artifacts/**/*.json
            artifacts/*-artifacts/**/*.png
      - name: Retain diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-diagnostics
          retention-days: 2
          path: |
            artifacts/source-tests.xml
            artifacts/ubuntu22-*.json
            artifacts/*-artifacts/**/*.json
            artifacts/*-artifacts/**/*.png
            build/pyinstaller/PDF-Prep/warn-PDF-Prep.txt

  compatibility:
    name: Verify same bytes on Ubuntu 24.04
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install desktop runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth fonts-dejavu-core \
            libegl1 libopengl0 libgl1 libdbus-1-3 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 poppler-utils
      - name: Retrieve the Ubuntu 22.04 packages
        uses: actions/download-artifact@v4
        with:
          name: pdf-prep-linux
          path: candidate
      - name: Verify and exercise the retained packages
        run: |
          cd candidate
          (cd dist && sha256sum -c SHA256SUMS.txt)
          mkdir extracted
          tar -xzf dist/PDF-Prep-linux-x86_64.tar.gz -C extracted
          python3 ../scripts/linux_dependencies.py extracted/PDF-Prep/LINUX-SYSTEM-DEPENDENCIES.json
          QT_QPA_PLATFORM=xcb xvfb-run -a extracted/PDF-Prep/PDF-Prep --self-test "$PWD/ubuntu24-portable.json"
          chmod +x dist/PDF-Prep-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=xcb xvfb-run -a dist/PDF-Prep-x86_64.AppImage --self-test "$PWD/ubuntu24-appimage.json"
      - name: Retain Ubuntu 24.04 evidence
        uses: actions/upload-artifact@v4
        with:
          name: pdf-prep-linux-ubuntu24
          if-no-files-found: error
          retention-days: 2
          path: |
            candidate/ubuntu24-*.json
            candidate/*-artifacts/**/*.json
            candidate/*-artifacts/**/*.png
      - name: Retain diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-compatibility-diagnostics
          retention-days: 2
          path: |
            candidate/ubuntu24-*.json
            candidate/*-artifacts/**/*.json
            candidate/*-artifacts/**/*.png
