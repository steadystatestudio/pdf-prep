name: Check source
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    if: github.event_name != 'push' || github.repository != 'steadystatestudio/pdf-prep-builds' || github.event.repository.private != true
    runs-on: windows-2022
    steps:
      - name: Preserve Git blob bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q --basetemp="${{ runner.temp }}/pdf-${{ github.run_id }}-${{ github.run_attempt }}" --junitxml=artifacts/source-tests.xml
        env:
          QT_QPA_PLATFORM: offscreen
